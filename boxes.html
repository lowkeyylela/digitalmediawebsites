<!doctype html>
<html lang="en">

<head>

        div {

        }

        #two {
            
            margin-left: auto;

            text-align: center;
            width: 200px;
            background: rgb(242, 244, 195);
            color: blueviolet;

            border-bottom: 40px solid black;
            border-bottom-left-radius: 0px;

        #three {

        }
        #four {
            background-image: linear-gradient( 101.9deg,  rgba(239,151,189,1) -13.9%, rgb(191, 220, 223) 34.6%, rgb(240, 209, 209) 88.6% );
